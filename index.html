<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceX Launch Explorer - UTS API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="spacex-icon">🚀</div>
            <h1>SpaceX <span class="highlight">Launch Explorer</span></h1>
            <p class="subtitle">Menampilkan data peluncuran roket SpaceX dari seluruh dunia</p>
            <p class="api-info">Data diambil dari <strong>SpaceX REST API</strong> (Public API - No API Key Required)</p>
        </div>

        <!-- Kontrol -->
        <div class="controls">
            <button id="refreshBtn" class="btn btn-primary">🔄 Refresh Data</button>
            <input type="text" id="searchInput" placeholder="🔍 Cari misi atau roket...">
            <select id="statusFilter">
                <option value="all">Semua Peluncuran</option>
                <option value="success">✅ Berhasil</option>
                <option value="failed">❌ Gagal</option>
                <option value="upcoming">⏳ Akan Datang</option>
            </select>
        </div>

        <!-- Status -->
        <div id="loadingMessage" class="loading">
            <div class="spinner"></div>
            <p>Mengambil data peluncuran SpaceX dari API...</p>
        </div>
        <div id="errorMessage" class="error hidden"></div>

        <!-- Statistik -->
        <div id="statsBar" class="stats-bar hidden">
            <span id="launchCount">0</span> peluncuran ditampilkan
        </div>

        <!-- Container Cards -->
        <div id="dataContainer" class="launches-container"></div>
    </div>

    <!-- Modal Detail -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" id="modalCloseBtn">✕</button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
